DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pro Fast Cricket</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; user-select: none; }
    body { background: #144518; color: white; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; }
    .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 20; gap: 12px; padding: 20px; text-align: center; }
    button { padding: 12px 22px; font-size: 16px; border: none; border-radius: 8px; background: #ff9800; color: #000; font-weight: bold; cursor: pointer; }
    button:active { transform: scale(0.95); }
    #scoreboard { width: 100%; background: #0a290d; padding: 8px 12px; display: flex; justify-content: space-between; font-size: 14px; font-weight: bold; border-bottom: 2px solid #4caf50; }
    #subBar { width: 100%; background: #1b5e20; padding: 4px 12px; display: flex; justify-content: space-between; font-size: 12px; color: #c8e6c9; }
    canvas { background: #2e7d32; width: 100%; max-width: 500px; flex-grow: 1; touch-action: none; }
    #controls { width: 100%; max-width: 500px; padding: 10px; background: #0a290d; display: flex; justify-content: space-around; align-items: center; gap: 8px; min-height: 64px; }
    #loftBtn { background: #e53935; color: white; padding: 10px 16px; border-radius: 50px; font-size: 14px; }
    #loftBtn.active { background: #ffeb3b; color: black; box-shadow: 0 0 12px #ffeb3b; }
    .bowlBtn { background: #29b6f6; color: black; padding: 10px 14px; font-size: 14px; }
    #msg { position: absolute; top: 85px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 5px black; pointer-events: none; z-index: 10; }
  </style>
</head>
<body>

  <!-- मेन मेनू -->
  <div id="menu" class="overlay">
    <h1>🏏 Pro Fast Cricket</h1>
    <p>मैच फ़ॉर्मेट चुनें:</p>
    <button onclick="initMatch(10)">10 ओवर मैच</button>
    <button onclick="initMatch(20)">20 ओवर मैच</button>
    <button onclick="initMatch(50)">50 ओवर मैच</button>
    <button id="resumeBtn" style="display:none; background:#4caf50; color:white;" onclick="loadGame()">पुराना मैच जारी रखें (Resume)</button>
  </div>

  <!-- टॉस स्क्रीन -->
  <div id="tossScreen" class="overlay" style="display:none;">
    <h2>आप टॉस जीत गए! 🪙</h2>
    <p>पहले क्या चुनेंगे?</p>
    <button onclick="startInnings('batting')">पहले बैटिंग (Bat)</button>
    <button onclick="startInnings('bowling')">पहले बॉलिंग (Bowl)</button>
  </div>

  <!-- इनिंग ब्रेक / मैच खत्म -->
  <div id="endScreen" class="overlay" style="display:none;">
    <h2 id="endTitle">पारी समाप्त!</h2>
    <p id="endDesc"></p>
    <button id="nextInnBtn" onclick="startSecondInnings()">दूसरी पारी शुरू करें</button>
    <button id="restartBtn" style="display:none;" onclick="location.reload()">नया मैच खेलें</button>
  </div>

  <!-- स्कोरबोर्ड -->
  <div id="scoreboard">
    <span id="scoreText">स्कोर: 0/0</span>
    <span id="overText">ओवर: 0.0 / 10</span>
    <span id="roleText">BATTING</span>
  </div>
  <div id="subBar">
    <span id="targetText">पहली पारी</span>
    <span id="lastBalls">पिछली गेंदें: -</span>
  </div>

  <div id="msg"></div>
  <canvas id="gameCanvas"></canvas>

  <!-- बैटिंग कंट्रोल -->
  <div id="batControls" class="controls" style="width:100%; max-width:500px; padding:10px; background:#0a290d; display:flex; justify-content:space-between; align-items:center;">
    <span style="font-size: 12px;">किसी भी दिशा में Swipe करें 👉</span>
    <button id="loftBtn" onclick="toggleLoft()">LOFT: OFF (4s)</button>
  </div>

  <!-- बॉलिंग कंट्रोल -->
  <div id="bowlControls" style="display:none; width:100%; max-width:500px; padding:10px; background:#0a290d; justify-content:space-around; align-items:center;">
    <button class="bowlBtn" onclick="throwUserBall('fast')">🔥 तेज़ (Fast)</button>
    <button class="bowlBtn" onclick="throwUserBall('spin')">🌀 स्पिन (Spin)</button>
    <button class="bowlBtn" style="background:#ab47bc; color:white;" onclick="simulateInnings()">⚡ Auto-Bowl</button>
  </div>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  let state = {
    maxOvers: 10, innings: 1, role: 'batting',
    runs: 0, wickets: 0, balls: 0, target: null,
    userScore: 0, aiScore: 0, recent: []
  };

  let isLoft = false, ballState = 'idle';
  let ball = { x: 0, y: 0, vx: 0, vy: 0 };
  let pitchSpot = { x: 0, y: 0 }; // बॉलिंग टप्पा
  let startX = 0, startY = 0;

  if (localStorage.getItem('proCricketSave')) {
    document.getElementById('resumeBtn').style.display = 'block';
  }

  function resize() {
    canvas.width = canvas.clientWidth;
    canvas.height = canvas.clientHeight;
    pitchSpot = { x: canvas.width / 2, y: canvas.height * 0.65 };
  }
  window.addEventListener('resize', resize);
  resize();

  function initMatch(overs) {
    state = { maxOvers: overs, innings: 1, role: 'batting', runs: 0, wickets: 0, balls: 0, target: null, userScore: 0, aiScore: 0, recent: [] };
    localStorage.removeItem('proCricketSave');
    document.getElementById('menu').style.display = 'none';
    document.getElementById('tossScreen').style.display = 'flex';
  }

  function startInnings(chosenRole) {
    state.role = chosenRole;
    document.getElementById('tossScreen').style.display = 'none';
    setupControls();
    updateUI();
    if (state.role === 'batting') setTimeout(aiBowlNext, 600);
    else showMsg("पिच पर टप्पा चुनें और बॉल डालें!");
  }

  function loadGame() {
    state = JSON.parse(localStorage.getItem('proCricketSave'));
    document.getElementById('menu').style.display = 'none';
    setupControls();
    updateUI();
    if (state.role === 'batting') setTimeout(aiBowlNext, 600);
  }

  function setupControls() {
    document.getElementById('batControls').style.display = state.role === 'batting' ? 'flex' : 'none';
    document.getElementById('bowlControls').style.display = state.role === 'bowling' ? 'flex' : 'none';
  }

  function toggleLoft() {
    isLoft = !isLoft;
    const btn = document.getElementById('loftBtn');
    btn.innerText = isLoft ? "LOFT: ON (6s)" : "LOFT: OFF (4s)";
    btn.classList.toggle('active', isLoft);
  }

  // --- बैटिंग लॉजिक ---
  function aiBowlNext() {
    if (checkInningsEnd()) return;
    ball.x = canvas.width / 2 + (Math.random() * 28 - 14);
    ball.y = canvas.height * 0.22;
    ball.vx = (canvas.width / 2 - ball.x) * 0.025;
    ball.vy = 5.5 + Math.random() * 3.5;
    ballState = 'bowling';
  }

  canvas.addEventListener('touchstart', e => {
    const rect = canvas.getBoundingClientRect();
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    if (state.role === 'bowling' && ballState === 'idle') {
      setPitchSpot(startX - rect.left, startY - rect.top);
    }
  });
  canvas.addEventListener('touchend', e => {
    if (state.role === 'batting') handleBatSwipe(e.changedTouches[0].clientX - startX, e.changedTouches[0].clientY - startY);
  });
  canvas.addEventListener('mousedown', e => {
    const rect = canvas.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    if (state.role === 'bowling' && ballState === 'idle') {
      setPitchSpot(startX - rect.left, startY - rect.top);
    }
  });
  canvas.addEventListener('mouseup', e => {
    if (state.role === 'batting') handleBatSwipe(e.clientX - startX, e.clientY - startY);
  });

  function handleBatSwipe(dx, dy) {
    if (ballState !== 'bowling' || state.role !== 'batting') return;
    const batY = canvas.height * 0.82;
    const dist = Math.abs(ball.y - batY);

    if (dist < 65) {
      ballState = 'hit';
      const angle = Math.atan2(dy, dx);
      ball.vx = Math.cos(angle) * 15;
      ball.vy = Math.sin(angle) * 15;

      let run = 0, label = "0";
      if (dist < 22) {
        run = isLoft ? 6 : 4; label = run;
        showMsg(isLoft ? "शानदार छक्का! 6️⃣" : "कड़क चौका! 4️⃣");
      } else if (dist < 45) {
        run = isLoft ? 2 : 1; label = run;
        showMsg(`${run} रन`);
      } else {
        if (isLoft && Math.random() > 0.45) {
          state.wickets++; label = "W"; showMsg("कैच आउट! ☝️");
        } else {
          run = 1; label = "1"; showMsg("1 रन");
        }
      }
      recordBall(run, label);
      setTimeout(aiBowlNext, 850);
    }
  }

  // --- बॉलिंग लॉजिक ---
  function setPitchSpot(x, y) {
    const minX = canvas.width/2 - 30, maxX = canvas.width/2 + 30;
    const minY = canvas.height * 0.45, maxY = canvas.height * 0.78;
    pitchSpot.x = Math.max(minX, Math.min(maxX, x));
    pitchSpot.y = Math.max(minY, Math.min(maxY, y));
  }

  function throwUserBall(type) {
    if (ballState !== 'idle' || state.role !== 'bowling') return;
    ball.x = canvas.width / 2;
    ball.y = canvas.height * 0.22;
    const speed = type === 'fast' ? 9.5 : 6.2;
    const swing = type === 'spin' ? (Math.random() > 0.5 ? 1.8 : -1.8) : (Math.random() - 0.5);
    const steps = (pitchSpot.y - ball.y) / speed;
    ball.vx = ((pitchSpot.x - ball.x) / steps) + (swing * 0.2);
    ball.vy = speed;
    ballState = 'userBowling';
  }

  function simulateInnings() {
    if (ballState !== 'idle') return;
    const remBalls = (state.maxOvers * 6) - state.balls;
    for (let i = 0; i < remBalls; i++) {
      if (state.wickets >= 10 || (state.target && state.runs >= state.target)) break;
      state.balls++;
      const r = Math.random();
      if (r < 0.06) state.wickets++;
      else if (r < 0.22) state.runs += 4;
      else if (r < 0.30) state.runs += 6;
      else if (r < 0.65) state.runs += 1;
    }
    updateUI();
    checkInningsEnd();
  }

  function recordBall(run, label) {
    state.runs += run;
    state.balls++;
    state.recent.push(label);
    if (state.recent.length > 6) state.recent.shift();
